0.5" fill="#69737f" font-weight="700" letter-spacing="0.5">CONTEXT</text><text x="29" y="427" font-size="12" fill="#3b4759" font-weight="400">Departmental view recorded in correspondence, never in a case record.</text><text x="29" y="448" font-size="10.5" fill="#175cc4" font-weight="400">mail thread · ██ messages</text><rect x="16" y="472" width="158" height="28" rx="3" fill="#0f3866" stroke="#0f3866" stroke-width="1"/><text x="95" y="490.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Attach 2 to the case</text><rect x="182" y="472" width="138.2" height="28" rx="3" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><text x="251.1" y="490.5" font-size="12" fill="#69737f" font-weight="400" text-anchor="middle">Why ranked first?</text><rect x="598" y="86" width="326" height="398" rx="4" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><line x1="598" y1="119" x2="924" y2="119" stroke="#e4e9f0" stroke-width="1"/><text x="611" y="108" font-size="12.5" fill="#14202f" font-weight="700">Narrow it down</text><text x="911" y="108" font-size="11" fill="#69737f" font-weight="400" text-anchor="end">ask</text><circle cx="637" cy="145" r="12" fill="#e9eff8" stroke="#ccd4e0"/><text x="637" y="149" font-size="9.5" fill="#0f3866" font-weight="800" text-anchor="middle">PO</text><rect x="645" y="131" width="250" height="33" rx="4" fill="#e9eff8" stroke="#ccd4e0" stroke-width="1"/><text x="657" y="151" font-size="12.5" fill="#3b4759" font-weight="400">Conserved shophouses, refusals only.</text><circle cx="625" cy="186" r="12" fill="#efe7fb" stroke="#5a2b9655"/><text x="625" y="190" font-size="11" fill="#5a2b96" font-weight="800" text-anchor="middle">◆</text><rect x="645" y="172" width="250" height="67" rx="4" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><text x="657" y="192" font-size="12.5" fill="#3b4759" font-weight="400">Three refusals since ████. Two</text><text x="657" y="209" font-size="12.5" fill="#3b4759" font-weight="400">turned on ██████, one on ██