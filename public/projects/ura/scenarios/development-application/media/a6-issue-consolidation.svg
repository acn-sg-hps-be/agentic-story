text><rect x="16" y="476" width="177.79999999999998" height="28" rx="3" fill="#0f3866" stroke="#0f3866" stroke-width="1"/><text x="104.89999999999999" y="494.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Accept draft into CX/CP</text><rect x="201.79999999999998" y="476" width="105.19999999999999" height="28" rx="3" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><text x="254.39999999999998" y="494.5" font-size="12" fill="#0f3866" font-weight="400" text-anchor="middle">Edit wording</text><rect x="315" y="476" width="131.6" height="28" rx="3" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><text x="380.8" y="494.5" font-size="12" fill="#69737f" font-weight="400" text-anchor="middle">Show 4 originals</text><rect x="598" y="86" width="326" height="398" rx="4" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><line x1="598" y1="119" x2="924" y2="119" stroke="#e4e9f0" stroke-width="1"/><text x="611" y="108" font-size="12.5" fill="#14202f" font-weight="700">Ask the agent</text><text x="911" y="108" font-size="11" fill="#69737f" font-weight="400" text-anchor="end">ask</text><circle cx="637" cy="145" r="12" fill="#e9eff8" stroke="#ccd4e0"/><text x="637" y="149" font-size="9.5" fill="#0f3866" font-weight="800" text-anchor="middle">PO</text><rect x="645" y="131" width="250" height="50" rx="4" fill="#e9eff8" stroke="#ccd4e0" stroke-width="1"/><text x="657" y="151" font-size="12.5" fill="#3b4759" font-weight="400">Why are LTA and the ██████ team in</text><text x="657" y="168" font-size="12.5" fill="#3b4759" font-weight="400">conflict?</text><circle cx="625" cy="203" r="12" fill="#efe7fb" stroke="#5a2b9655"/><text x="625" y="207" font-size="11" fill="#5a2b96" font-weight="800" text-anchor="middle">◆</text><rect x="645" y="189" width="250" height="84" rx="4" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><text x="657" y="209" font-size="12.5" fill="#3b4759" font-weight="400">LTA requires ██████ at the access</text><text x="657" y="226" font-size="12.5" fill="#3b4759" font-weight="400">point; the team requires ██████</text><text x="657" y="243" font-size="12.5" fill="#3b4759" font-weight="400">retained. Same elevation.</text><text x="657" y="262" font-size="10.5" fill="#175cc4" font-weight="400">CX/CP comment ██ · DAX issue ██</text><circle cx="637" cy="295" r="12" fill="#e9eff8" stroke="#ccd4e0"/><text x="637" y="299" font-size="9.5" fill="#0f3866" font-weight="800" text-anchor="middle">PO</text><rect x="645" y="281" width="250" height="33" rx="4" fill="#e9eff8" stroke="#ccd4e0" stroke-width="1"/><text x="657" y="301" font-size="12.5" fill="#3b4759" font-weight="400">Anything raised twice by one team?</text><circle cx="625" cy="336" r="12" fill="#efe7fb" stroke="#5a2b9655"/><text x="625" y="340" font-size="11" fill="#5a2b96" font-weight="800" text-anchor="middle">◆</text><rect x="645" y="322" width="250" height="50" rx="4" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><text x="657" y="342" font-size="12.5" fill="#3b4759" font-weight="400">Two, both on ██████.</text><text x="657" y="361" font-size="10.5" fill="#175cc4" font-weight="400">DAX issues ██ and ██</text><rect x="611" y="441" width="300" height="30" rx="3" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/><text x="621" y="460.5" font-size="11.5" fill="#98a1ad" font-weight="400">Ask about a cluster, source or conflict</text><rect x="877" y="445" width="30" height="22" rx="3" fill="#0f3866"/><text x="892" y="460" font-size="12" fill="#fff" font-weight="400" text-anchor="middle">↵</text>
